<!DOCTYPE html>
<html>
<head>
  <title>Stack Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 100px;
      border-radius: 12px;
      border: none;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      background: #333;
      color: white;
    }

    .stack-item {
      background: #222;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      word-wrap: break-word;
    }

    .item-buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .small-btn {
      flex: 1;
      background: #444;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>Stack Bank</h1>

<textarea id="input" placeholder="Paste copied text here..."></textarea>

<button onclick="pasteClipboard()">
📋 Paste Clipboard
</button>

<button onclick="addText()">
➕ Add To Stack
</button>

<button onclick="copyAll()">
📦 Copy Entire Stack
</button>

<button onclick="clearStack()">
🗑 Clear Everything
</button>

<div id="stack"></div>

<script>
let stack = JSON.parse(localStorage.getItem("stack")) || [];

function saveStack() {
  localStorage.setItem("stack", JSON.stringify(stack));
}

function renderStack() {
  const container = document.getElementById("stack");
  container.innerHTML = "";

  stack.forEach((item, index) => {
    container.innerHTML += `
      <div class="stack-item">
        ${item}

        <div class="item-buttons">
          <button class="small-btn"
            onclick="copyOne(${index})">
            Copy
          </button>

          <button class="small-btn"
            onclick="deleteItem(${index})">
            Delete
          </button>
        </div>
      </div>
    `;
  });
}

async function pasteClipboard() {
  try {
    const text =
      await navigator.clipboard.readText();

    document.getElementById("input").value =
      text;

  } catch {
    alert("Clipboard blocked. Paste manually.");
  }
}

function addText() {
  const input =
    document.getElementById("input");

  const text = input.value.trim();

  if (!text) return;

  stack.push(text);

  saveStack();
  renderStack();

  input.value = "";
}

function copyAll() {
  navigator.clipboard.writeText(
    stack.join("\n\n")
  );

  alert("Entire stack copied.");
}

function copyOne(index) {
  navigator.clipboard.writeText(
    stack[index]
  );

  alert("Copied.");
}

function deleteItem(index) {
  stack.splice(index, 1);

  saveStack();
  renderStack();
}

function clearStack() {
  if (!confirm("Clear everything?"))
    return;

  stack = [];

  saveStack();
  renderStack();
}

renderStack();
</script>

</body>
</html>
