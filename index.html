<!DOCTYPE html>
<html>
<head>
  <title>Stack Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    h1, h2 {
      text-align: center;
    }

    textarea,
    input {
      width: 100%;
      border-radius: 12px;
      border: none;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    textarea {
      height: 100px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      background: #333;
      color: white;
    }

    .stack-item {
      background: #222;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      word-wrap: break-word;
    }

    .item-buttons {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .small-btn {
      flex: 1;
      background: #444;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>STACK</h1>
<p>Your clipboard holding bank</p>

<textarea
  id="input"
  placeholder="Paste copied text here..."
></textarea>

<button onclick="pasteClipboard()">
📋 Paste Clipboard
</button>

<button onclick="quickAddClipboard()">
⚡ Quick Add Clipboard
</button>

<button onclick="addText()">
➕ Add To Stack
</button>

<button onclick="copyAll()">
📦 Copy Entire Stack
</button>

<button onclick="clearStack()">
🗑 Clear Everything
</button>

<div id="stack"></div>

<hr>

<h2>Saved Phrases</h2>

<input
  id="savedTitle"
  placeholder="Phrase name"
/>

<textarea
  id="savedText"
  placeholder="Save text for later..."
></textarea>

<button onclick="savePhrase()">
⭐ Save Phrase
</button>

<div id="savedPhrases"></div>

<script>

let stack =
  JSON.parse(
    localStorage.getItem("stack")
  ) || [];

let savedPhrases =
  JSON.parse(
    localStorage.getItem(
      "savedPhrases"
    )
  ) || [];

function saveStack() {
  localStorage.setItem(
    "stack",
    JSON.stringify(stack)
  );
}

function saveSavedPhrases() {
  localStorage.setItem(
    "savedPhrases",
    JSON.stringify(savedPhrases)
  );
}

function renderStack() {

  const container =
    document.getElementById("stack");

  container.innerHTML = "";

  stack.forEach((item, index) => {

    container.innerHTML += `
      <div class="stack-item">
        ${item}

        <div class="item-buttons">

          <button
            class="small-btn"
            onclick="copyOne(${index})">
            Copy
          </button>

          <button
            class="small-btn"
            onclick="deleteItem(${index})">
            Delete
          </button>

        </div>
      </div>
    `;
  });
}

function renderSavedPhrases() {

  const container =
    document.getElementById(
      "savedPhrases"
    );

  container.innerHTML = "";

  savedPhrases.forEach(
    (phrase, index) => {

      container.innerHTML += `
      <div class="stack-item">

        <strong>
          ${phrase.title}
        </strong>

        <br><br>

        ${phrase.text}

        <div class="item-buttons">

          <button
            class="small-btn"
            onclick="
              navigator.clipboard
              .writeText(
                \`${phrase.text}\`
              )
            ">
            Copy
          </button>

          <button
            class="small-btn"
            onclick="
              deletePhrase(${index})
            ">
            Delete
          </button>

        </div>

      </div>
      `;
    }
  );
}

async function pasteClipboard() {

  try {

    const text =
      await navigator.clipboard
        .readText();

    document.getElementById(
      "input"
    ).value = text;

  } catch {

    alert(
      "Clipboard blocked."
    );
  }
}

async function quickAddClipboard() {

  try {

    const text =
      await navigator.clipboard
        .readText();

    if (!text.trim()) return;

    stack.push(text);

    saveStack();
    renderStack();

  } catch {

    alert(
      "Clipboard blocked."
    );
  }
}

function addText() {

  const input =
    document.getElementById(
      "input"
    );

  const text =
    input.value.trim();

  if (!text) return;

  stack.push(text);

  saveStack();
  renderStack();

  input.value = "";
}

function savePhrase() {

  const title =
    document.getElementById(
      "savedTitle"
    ).value.trim();

  const text =
    document.getElementById(
      "savedText"
    ).value.trim();

  if (!title || !text)
    return;

  savedPhrases.push({
    title,
    text
  });

  saveSavedPhrases();

  renderSavedPhrases();

  document.getElementById(
    "savedTitle"
  ).value = "";

  document.getElementById(
    "savedText"
  ).value = "";
}

function copyAll() {

  navigator.clipboard
    .writeText(
      stack.join("\n\n")
    );
}

function copyOne(index) {

  navigator.clipboard
    .writeText(
      stack[index]
    );
}

function deleteItem(index) {

  stack.splice(index, 1);

  saveStack();
  renderStack();
}

function deletePhrase(index) {

  savedPhrases.splice(index, 1);

  saveSavedPhrases();
  renderSavedPhrases();
}

function clearStack() {

  if (!confirm(
    "Clear stack?"
  )) return;

  stack = [];

  saveStack();
  renderStack();
}

renderStack();
renderSavedPhrases();

</script>

</body>
</html>
